server.port=8080

# Spring Application Configuration
spring.application.name=uzhavarsetu-backend

# =========================================
# MySQL Database
# =========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/uzhavarsetu}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Admin@123}

# =========================================
# JPA / Hibernate
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ==========================================
# EMAIL - GMAIL SMTP
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pragathes075@gmail.com
spring.mail.password=andojvdsegmqbgdt
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
admin.email=pragathes075@gmail.com

# ==========================================
# JWT
# ==========================================
jwt.secret=YOUR_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_CHARACTERS_LONG
jwt.expiration=86400000

# ==========================================
# Multipart file upload
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ==========================================
# Kafka Configuration
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=batchEvent:com.uzhavarsetu.model.BatchEvent

spring.kafka.consumer.group-id=uzhavarsetu-traceability
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.admin.fail-fast=false
spring.kafka.admin.auto-create=false
spring.kafka.auto-create-topics=false

# UzhavarSetu Kafka Topic
uzhavarsetu.kafka.topic=uzhavarsetu.batch.events

# Logging
logging.level.org.apache.kafka=ERROR
logging.level.com.uzhavarsetu=INFO

# ==========================================
# Government of India Data.gov.in Mandi API
# ==========================================
mandi.api.url=${MANDI_API_URL:https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070}
mandi.api.key=${MANDI_API_KEY:579b464db66ec23bdd00000107f97847140f47126c2d79a3980b2682}


